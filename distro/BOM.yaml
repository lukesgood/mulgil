# Mulgil bill of materials — the execution layer of Sumun (ADR 0006).
# Every profile deploys exactly these versions; drift is a bug.
package: mulgil
version: 0.1.0-dev
profiles: [trino-k8s, athena]
engine:
  trino:            { version: "479", required: true }
  trino-opa-plugin: { bundled_with: trino, note: "tier-B enforcement; spike in Phase 2a" }
  trino-gateway:    { version: "1.x", optional: true, phase: 3 }
  prometheus:       { version: "2.5x", retention: "90d" }
  alertmanager:     { version: "0.27" }
  postgresql:       { version: "16", note: "mulgil_ops schema, Airflow metadata" }
  mulgil-ops:       { version: "0.1.0-dev", source: ops/ }
landing_zone:        # optional module
  apache-polaris:   { version: "1.x" }
  dbt-core:         { version: "1.9" }
  dbt-trino:        { version: "1.9", profiles: [trino-k8s] }
  dbt-athena:       { version: "1.9", profiles: [athena] }
  airflow:          { version: "2.10", profiles: [trino-k8s] }
storage:             # pluggable; the customer's store is the default
  byo-s3:           { kinds: [s3, minio-customer-licence, ceph-rgw, other-s3-compatible], default: true }
  seaweedfs:        { version: "3.9x", option: A, source: storage/seaweedfs/, note: "only when the customer has no object store" }
optional:
  grafana:          { version: "11", license: AGPL-3.0, note: "unmodified image, dashboards as JSON only" }
sumun:
  server:           { version: ">=2.0.0-dev", source: "https://github.com/lukesgood/sumun" }
  console:          { source: "sumun ee/console", note: "code is commercial; specs in console/screens/" }
aws_managed:
  athena:           { engine: "v3", profiles: [athena] }
  s3-tables:        { profiles: [athena] }
  lake-formation:   { profiles: [athena] }
