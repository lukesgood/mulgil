# Mulgil single-laptop fixture — a shrunken `trino-k8s` profile.
# SeaweedFS (S3 + Iceberg REST catalog), Trino, Postgres (Airflow/Sumun metadata).
# First bring-up is pending; treat as a scaffold until scripts/up.sh passes.
services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: >
      mini
      -ip=seaweedfs
      -dir=/data
      -s3.config=/etc/seaweedfs/s3config.json
      -tableBucket=${ICEBERG_BUCKET:-lakehouse}
    ports:
      - "8333:8333"   # S3 API
      - "8181:8181"   # Iceberg REST catalog
      - "9333:9333"   # master UI
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3config.json:/etc/seaweedfs/s3config.json:ro

  trino:
    image: trinodb/trino:479
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
    depends_on:
      - seaweedfs

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-mulgil}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set in compose/.env}
      POSTGRES_DB: mulgil
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  seaweedfs-data:
  pg-data:
