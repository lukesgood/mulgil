# Mulgil `trino-k8s` — on-prem / air-gapped. No egress.
seaweedfs:
  enabled: true
  master: { replicas: 3 }
  volume: { replicas: 3, storage: 500Gi, storageClass: local-path }
  filer:
    replicas: 2
    backend: postgres          # filer metadata store — back this up first
  s3: { enabled: true }
  icebergCatalog: { enabled: true, tableBucket: lakehouse }
  volumeReplication: "010"     # one copy on another rack

polaris:
  enabled: false               # turn on when Sumun needs credential vending
                               # or a second engine shares the catalog

trino:
  coordinator: { resources: { memory: 8Gi } }
  worker: { replicas: 2, resources: { memory: 16Gi } }
  faultTolerantExecution: true
  exchangeManager: { s3Bucket: trino-exchange }
  accessControl:
    rulesConfigMap: sumun-trino-rules   # generated by Sumun from its policies

airflow:
  enabled: true
  dags:
    dbtRun: "0 2 * * *"
    icebergMaintenance: "0 4 * * 0"     # optimize + expire_snapshots weekly

postgres:
  enabled: true
  storage: 50Gi
